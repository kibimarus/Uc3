<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha de personagens</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game">
        <h1> Bem-vindo a Batalha de Herois!</h1>
      
        <h1 id="escolha">Escolha seu personagem:</h1>

        <div class="personagem">
            <div class="card" onclick="jogar('Arqueiro')">
                <img src="img/ARQUEIRO.jpg" alt="">
                <h2>Arqueiro</h2>
            </div>
            <div class="card" onclick="jogar('Guerreiro')">
                <img src="img/guerreiro.jpg" alt="">
                <h2>Guerreiro</h2>
            </div>
            <div class="card" onclick="jogar('Ladino')">
                <img src="img/ladino.jpg" alt="">
                <h2>Ladino</h2>
            </div>
            <div class="card" onclick="jogar('Mago')">
                <img src="img/mago.jpg" alt="">
                <h2>Mago</h2>
            </div>
            <div class="card" onclick="jogar('Paladino')">
                <img src="img/paladino.jpg" alt="">
                <h2>Paladino</h2>
            </div>
    
        
        </div>
        <div class="placar">
            <h1 id="pontos-jogador">Seus pontos: 0</h2>
            <h1 id="pontos-maquina">Máquina pontos: 0</h2>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
