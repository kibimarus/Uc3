<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Pipoca</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo"> CinePipoca</div>
        <nav class="menu">
            <a href="#inicio">Início</a>
            <a href="#filme">Filmes</a>
            <a href="#combo">Combo</a>
        </nav>
    </header>

    <main>
                 
            <section class="inicio" id="inicio">
                <div class="inicio-texto">
                    <h1>Bem-vindo ao Cine Pipoca!</h1>
            
                    <h2>Escolha o filme:</h2>
            
                    <select id="filme">
                        
                        <option value="D039">O Poderoso Chefão</option>
                        <option value="B678">Matrix</option>
                        <option value="D889">O Senhor dos Anéis</option>
                        <option value="M912">Interestelar</option>
                        <option value="G007">O Resgate do Soldado Ryan</option>
                    </select>
            
                    <h2>Quantidade de ingressos:</h2>
            
                    <input type="number" id="quantidade" min="1" value="1">
            
                    <h2>Escolha seu combo:</h2>
            
                    <select id="combo">
                        <option value="nenhum">Nenhum combo</option>
                        <option value="COMBO-005">Doritos + Refri Lata</option>
                        <option value="COMBO-072">Pipoca Salgada + Coca-Cola</option>
                        <option value="COMBO-777">Pipoca Doce + Suco</option>
                        <option value="COMBO-215">Refil de Pipoca + 2 Recargas</option>
                    </select>

                    <h2>Quantidade de Combos:</h2>
                    <input type="number" id="quantidade" min="0" value="1">
            
                    <br><br>
            
                    <button  id="calcular" onclick="calcular()">Continuar</button>
            
                    <div id="resultado"></div>
                </div>
            </section>

       
    </main>
   

    <script src="js/script.js"></script>
</body>
</html>
